name: Update Data and Deploy to gh-pages

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout devel branch
        uses: actions/checkout@v5
        with:
          ref: devel
          path: main

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libpng-dev

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
            any::jsonlite
            any::rmarkdown
            any::prettydoc
            any::readr
            any::digest
            any::R.utils
            any::gson
            any::wget
            any::ggiraph
            any::png
            any::KEGGREST
            any::AnnotationDbi
            any::org.Hs.eg.db
            any::GO.db
            any::scatterpie
            any::enrichplot
            any::ggtree
            any::httr
            YuLab-SMU/obolite
            YuLab-SMU/yulab.utils
            YuLab-SMU/enrichit
            YuLab-SMU/enrichplot
            YuLab-SMU/GOSemSim
            YuLab-SMU/DOSE
            YuLab-SMU/clusterProfiler
          working-directory: main
          needs: check
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      # Each upstream source (HPO release assets, MGI/MPO, NCG) can be slow or
      # down for a while. Seeding data-raw/ with the last published artefacts
      # means a source that fails today leaves its previously published file in
      # place instead of taking the whole deployment down with it;
      # generate-md5.R keeps the old md5 entry of any file it did not regenerate.
      - name: Seed data-raw with previously published artefacts
        run: |
          cp ../gh-pages/*.sqlite.gz ../gh-pages/NCG.gson.gz ../gh-pages/md5.txt data-raw/ 2>/dev/null || true
          ls -l data-raw/*.gz data-raw/md5.txt || true
        working-directory: main

      # One step per source, each allowed to fail: a single unreachable upstream
      # must not discard the data the other sources just produced. The last step
      # still turns the run red so the outage stays visible.
      - name: Generate HPO data
        id: gen_hpo
        continue-on-error: true
        run: Rscript create-HPO.R
        working-directory: main/data-raw

      - name: Generate HDO data
        id: gen_hdo
        continue-on-error: true
        run: Rscript create-HDO.R
        working-directory: main/data-raw

      - name: Generate MPO data
        id: gen_mpo
        continue-on-error: true
        run: Rscript create-MPO.R
        working-directory: main/data-raw

      - name: Generate NCG data
        id: gen_ncg
        continue-on-error: true
        run: Rscript create-NCG.R
        working-directory: main/data-raw

      - name: Generate Index and MD5
        run: |
          cd data-raw
          Rscript -e 'rmarkdown::render("index.rmd")'
          Rscript generate-md5.R
        working-directory: main

      - name: Copy files to gh-pages
        run: |
          # Copy generated sqlite.gz files
          cp main/data-raw/*.sqlite.gz gh-pages/
          
          # Copy NCG data
          cp main/data-raw/NCG.gson.gz gh-pages/
          
          # Copy index.html
          cp main/data-raw/index.html gh-pages/
          
          # Copy md5.txt
          cp main/data-raw/md5.txt gh-pages/
          
      - name: Commit and Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data and site: $(date +'%Y-%m-%d')"
            git push origin gh-pages
          fi

      # Runs after the deployment so that a stale upstream still ships the data
      # that did refresh, while the red X points at the source that did not.
      - name: Check for datasets that could not be refreshed
        if: always()
        run: |
          failed=""
          [ '${{ steps.gen_hpo.outcome }}' = 'failure' ] && failed="$failed HPO"
          [ '${{ steps.gen_hdo.outcome }}' = 'failure' ] && failed="$failed HDO"
          [ '${{ steps.gen_mpo.outcome }}' = 'failure' ] && failed="$failed MPO"
          [ '${{ steps.gen_ncg.outcome }}' = 'failure' ] && failed="$failed NCG"

          if [ -n "$failed" ]; then
            echo "::error::Upstream source unreachable, dataset(s) not refreshed:$failed (previously published files were kept)"
            exit 1
          fi
          echo "All datasets refreshed."
